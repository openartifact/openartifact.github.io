# GitHub Actions are pinned by commit SHA; vitepress and vue are pinned exactly
# in package.json. bun-version, GO_VERSION and ACTIONLINT_VERSION in the
# workflows are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
