# Builds https://openartifact.github.io/: the landing page, the docs of
# openartifact/openartifact main (/latest/) and of the newest stable tag of each
# of the last 5 minor lines (/vX.Y/), then publishes them to GitHub Pages.
name: Pages

on:
  push:
    # `rebuild` receives a trigger commit (force-pushed with a deploy key) from
    # openartifact/openartifact's docs-site-trigger.yml on docs changes and tags.
    branches: [main, rebuild]
  # Fallback poll: a run rebuilds only when docs/ of openartifact/openartifact changed or a
  # release tag appeared (see the check job); no secret is needed for that.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run is never cancelled mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"

jobs:
  check:
    name: check for changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes and manual runs always rebuild; only the poll compares.
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wanted=$(scripts/fingerprint.sh)
          deployed=$(curl -fsS "https://openartifact.github.io/source.txt" || true)
          echo "wanted=$wanted deployed=$deployed"
          if [ "$wanted" = "$deployed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out openartifact/openartifact (docs source, all tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openartifact/openartifact
          path: oa
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun test scripts

      - name: Build landing page and docs
        run: bun run build --oa oa

      - name: Record what the site was built from
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fingerprint.sh > _site/source.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
